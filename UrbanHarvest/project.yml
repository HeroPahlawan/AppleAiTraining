name: UrbanHarvest

options:
  bundleIdPrefix: id.urbanharvest
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: id

settings:
  base:
    SWIFT_VERSION: "5.0"            # Swift 5 language mode (requires a Swift 5.9+ toolchain / Xcode 15+)
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  UrbanHarvest:
    type: application
    platform: iOS
    sources:
      # Everything under UrbanHarvest/ is part of the app target, including
      # Models/*.mlmodel. Re-run `xcodegen generate` after dropping in models.
      - path: UrbanHarvest
    info:
      path: UrbanHarvest/App/Info.plist
      properties:
        CFBundleDisplayName: UrbanHarvest
        CFBundleDevelopmentRegion: id
        CFBundleLocalizations: [id, en]
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: "UrbanHarvest memakai kamera untuk mendeteksi dan menghitung buah yang baik dan yang cacat saat panen."
        NSPhotoLibraryUsageDescription: "UrbanHarvest membuka foto Anda untuk menguji deteksi buah tanpa kamera langsung."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: id.urbanharvest.app
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        # Leave empty; set your own team in Xcode for device builds.
        DEVELOPMENT_TEAM: ""
    scheme:
      testTargets:
        - UrbanHarvestTests
      gatherCoverageData: true

  UrbanHarvestTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: UrbanHarvest
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: id.urbanharvest.tests
